apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ngf
  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/k8s/nginx-gateway
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/k8s/cert-manager
  prune: true
  wait: true
  timeout: 10m

  sourceRef:
    kind: GitRepository
    name: flux-system

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb
  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/k8s/metallb-system
  prune: true
  wait: true
  timeout: 10m

  sourceRef:
    kind: GitRepository
    name: flux-system

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-config
  namespace: flux-system
spec:
  dependsOn:
    - name: metallb

  interval: 10m
  path: ./infra/k8s/metallb-system-config
  prune: true
  wait: true
  timeout: 10m

  sourceRef:
    kind: GitRepository
    name: flux-system

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg
  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/k8s/cnpg-system
  prune: true
  wait: true
  timeout: 10m

  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tc-system
  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/k8s/tc-system
  prune: true
  wait: true
