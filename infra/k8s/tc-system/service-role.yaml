apiVersion: v1
kind: ServiceAccount
metadata:
  name: tysoncloud-status
  namespace: tc-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tysoncloud-status
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tysoncloud-status
subjects:
  - kind: ServiceAccount
    name: tysoncloud-status
    namespace: tc-system
roleRef:
  kind: ClusterRole
  name: tysoncloud-status
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tysoncloud-backend
  namespace: tc-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tysoncloud-backend
subjects:
  - kind: ServiceAccount
    name: tysoncloud-backend
    namespace: tc-system
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
