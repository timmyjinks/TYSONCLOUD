<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Service unavailable — TYSONCLOUD</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap");

    :root {
      color-scheme: dark;
      --color-bg: #08090b;
      --color-text: #f3f3f5;
      --color-text-muted: #9a9aa4;
      --color-text-faint: #57575f;
      --color-border: #232428;
      --color-accent: #ff4433;
      --font-sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    ::selection {
      background: var(--color-accent);
      color: white;
    }

    main {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 640px;
      margin: 0 auto;
      padding: 48px 24px;
    }

    .label {
      font-weight: 600;
      font-size: 14px;
      color: var(--color-accent);
      letter-spacing: 0.02em;
      text-transform: uppercase;
      margin: 0 0 20px;
    }

    h1 {
      font-size: clamp(32px, 5vw, 44px);
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.01em;
      margin: 0 0 20px;
    }

    p {
      font-size: 17px;
      line-height: 1.65;
      color: var(--color-text-muted);
      margin: 0 0 12px;
      max-width: 46ch;
    }

    footer {
      margin-top: 64px;
      padding-top: 20px;
      border-top: 1px solid var(--color-border);
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--color-text-faint);
    }
  </style>
</head>

<body>
  <main role="alert">
    <p class="label">Service unavailable</p>
    <h1>This service isn't reachable right now.</h1>
    <p>
      It may still be starting up, or it may not be responding to requests.
      The request didn't reach a running instance.
    </p>
    <p>If you just deployed, wait a moment and reload the page. If this keeps happening, check the service's logs.</p>

    <footer>
      <span>TYSONCLOUD</span>
      <span id="timestamp"></span>
    </footer>
  </main>

  <script>
    document.getElementById("timestamp").textContent = new Date().toISOString();
  </script>
</body>

</html>
