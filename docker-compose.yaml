services:
  backend:
    build:
      context: ./backend
      dockerfile: cmd/deploy/Dockerfile
    container_name: tysoncloud-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ADDR: ":8080"
      ALLOWED_ORIGINS: "http://localhost:3000"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: tysoncloud-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VITE_API_URL: "http://localhost:8080"
    ports:
      - "3000:3000"
    depends_on:
      - backend
